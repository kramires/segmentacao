[project]
name = "segmentacao"
version = "0.2.0"
description = "Segmentar, recortar, remover e colar objetos em imagens (SAM 2.1 + LaMa)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "sam2>=1.1",
    "huggingface-hub>=0.31",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "opencv-python-headless>=4.11",
    "numpy>=2.0",
    "pillow>=11.0",
    "onnxruntime>=1.20",
    "transformers>=4.50",
]

[project.scripts]
segmentacao = "segmentacao.servidor:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["segmentacao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Não depende do .pth da instalação editável: em pastas sincronizadas pelo iCloud o
# macOS marca esse arquivo como oculto e o Python passa a ignorá-lo.
pythonpath = ["."]

[tool.ruff]
line-length = 100
